<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday 🌸</title>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const FLOWER_COUNT = 18;
    const ANIMATION_TIME = 6500;

    function BirthdayFlower() {
      const [started, setStarted] = useState(false);
      const [showLetter, setShowLetter] = useState(false);
      const [showVideo, setShowVideo] = useState(false);

      useEffect(() => {
        if (!started) return;

        const letterTimer = setTimeout(() => setShowLetter(true), 4300);

        return () => {
          clearTimeout(letterTimer);
        };
      }, [started]);

      const flowers = Array.from({ length: FLOWER_COUNT }, (_, i) => ({
        id: i,
        left: `${5 + ((i * 37) % 90)}%`,
        delay: `${(i * 0.23) % 2.2}s`,
        duration: `${4.2 + ((i * 17) % 30) / 10}s`,
        size: `${18 + ((i * 13) % 20)}px`,
        rotate: `${(i * 41) % 360}deg`,
      }));

      const handlePlayVideo = () => {
        setShowVideo(true);
      };

      return (
        <main className="birthday-page">
          <style>{`
            * { box-sizing: border-box; }
            body { margin: 0; background: #fff4f8; font-family: Georgia, "Times New Roman", serif; }

            .birthday-page {
              min-height: 100vh; overflow: hidden; position: relative;
              display: flex; align-items: center; justify-content: center; padding: 24px;
              background: radial-gradient(circle at 50% 20%, #fff 0, #fff4f8 45%, #ffe5ef 100%);
              color: #5b2940;
            }

            .start-screen { text-align: center; z-index: 10; }
            .start-screen h1 { font-size: clamp(32px, 8vw, 64px); margin: 0 0 12px; }
            .start-screen p { font-size: 18px; opacity: .8; margin-bottom: 24px; }

            .start-button {
              border: 0; border-radius: 999px; padding: 14px 28px; font-size: 18px;
              font-weight: 700; cursor: pointer; color: white; background: #d85a88;
              box-shadow: 0 8px 25px rgba(180, 55, 105, .25);
              transition: transform 0.2s;
            }

            .start-button:hover {
              transform: scale(1.05);
            }

            .flower-field { position: absolute; inset: 0; pointer-events: none; }

            .flower {
              position: absolute; bottom: -60px; left: var(--left);
              width: var(--size); height: var(--size);
              font-size: var(--size);
              display: flex; align-items: center; justify-content: center;
              animation: floatUp var(--duration) var(--delay) linear infinite,
                         sway 2.4s ease-in-out infinite alternate;
              filter: drop-shadow(0 3px 5px rgba(100, 40, 65, .12));
            }

            @keyframes floatUp {
              0% { transform: translateY(0) rotate(var(--rotate)) scale(.6); opacity: 0; }
              12% { opacity: 1; } 85% { opacity: 1; }
              100% {
                transform: translateY(-115vh) rotate(calc(var(--rotate) + 220deg)) scale(1);
                opacity: 0;
              }
            }

            @keyframes sway {
              from { margin-left: -10px; } to { margin-left: 10px; }
            }

            .letter {
              position: relative; z-index: 5; width: min(650px, 92vw);
              padding: clamp(28px, 6vw, 54px); text-align: center;
              background: rgba(255,255,255,.9); border: 2px solid rgba(216,90,136,.25);
              border-radius: 28px; box-shadow: 0 20px 70px rgba(130,50,85,.18);
              animation: letterIn 0.8s ease forwards;
            }

            .letter h1 { margin: 0 0 18px; font-size: clamp(34px,7vw,58px); color: #c43f73; }
            .letter p { margin: 10px 0; font-size: clamp(17px,3vw,22px); line-height: 1.65; }
            .signature { margin-top: 24px !important; font-weight: 700; color: #c43f73; }

            .play-button {
              border: 0; border-radius: 999px; padding: 12px 24px; font-size: 16px;
              font-weight: 700; cursor: pointer; color: white; background: #c43f73;
              box-shadow: 0 8px 25px rgba(196, 63, 115, .35);
              transition: transform 0.2s, box-shadow 0.2s;
              margin-top: 20px;
            }

            .play-button:hover {
              transform: scale(1.08);
              box-shadow: 0 10px 35px rgba(196, 63, 115, .45);
            }

            .play-button:active {
              transform: scale(0.96);
            }

            @keyframes letterIn {
              from { opacity: 0; transform: translateY(35px) scale(.92); }
              to { opacity: 1; transform: translateY(0) scale(1); }
            }

            .video-wrap {
              position: fixed; z-index: 20; inset: 0; display: flex;
              align-items: center; justify-content: center; padding: 20px;
              background: rgba(20,8,14,.94); animation: fadeIn .8s ease;
            }

            .video-wrap video {
              width: min(900px,96vw); max-height: 90vh; border-radius: 18px;
              box-shadow: 0 20px 80px rgba(0,0,0,.45); background: #000;
            }

            .video-note {
              position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
              color: white; font-family: Arial, sans-serif; font-size: 13px; opacity: .75;
            }

            .close-video {
              position: fixed; top: 20px; right: 20px; z-index: 21;
              background: rgba(255,255,255,0.2); border: none; color: white;
              font-size: 30px; cursor: pointer; width: 50px; height: 50px;
              border-radius: 50%; display: flex; align-items: center; justify-content: center;
              transition: background 0.2s;
            }

            .close-video:hover {
              background: rgba(255,255,255,0.3);
            }

            @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
          `}</style>

          {!started && (
            <section className="start-screen">
              <h1>🌸 A Little Surprise 🌸</h1>
              <p>Something is waiting for you...</p>
              <button className="start-button" onClick={() => setStarted(true)}>
                Open the surprise 💗
              </button>
            </section>
          )}

          {started && !showVideo && (
            <div className="flower-field" aria-hidden="true">
              {flowers.map((flower) => (
                <div
                  className="flower"
                  key={flower.id}
                  style={{
                    "--left": flower.left,
                    "--delay": flower.delay,
                    "--duration": flower.duration,
                    "--size": flower.size,
                    "--rotate": flower.rotate,
                  }}
                >
                  🌸
                </div>
              ))}
            </div>
          )}

          {started && showLetter && !showVideo && (
            <section className="letter">
              <h1>Happy Birthday! 🎂🌸</h1>
              <p>Happy birthday to one of the most chaotic, annoying, funny and genuinely special people I know. 😂</p>
              <p>I hope this year brings you a ridiculous amount of happiness, good memories, and absolutely zero boring days.</p>
              <p>Stay exactly as awesome as you are, bestie. Have an amazing birthday! 💗</p>
              <p className="signature">— From your bestie 🗿🌸</p>
              <button className="play-button" onClick={handlePlayVideo}>
                ▶ Play Video 🎬
              </button>
            </section>
          )}

          {showVideo && (
            <div className="video-wrap">
              <button className="close-video" onClick={() => setShowVideo(false)}>
                ✕
              </button>
              <video src="./birthday.mp4" controls autoPlay playsInline preload="auto" />
              <div className="video-note">
                If the video doesn't start automatically, press ▶.
              </div>
            </div>
          )}
        </main>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<BirthdayFlower />);
  </script>
</body>
</html>
